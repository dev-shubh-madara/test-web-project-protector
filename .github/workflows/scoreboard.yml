name: Scoreboard
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  scoreboard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install CipherBloom Guardian
        run: pip install git+https://github.com/dev-shubh-madara/project-protector
      - name: Build the lab, run it and scan it
        run: python lab.py scoreboard
      - name: Keep the report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scoreboard-report
          path: scoreboard-report.html
